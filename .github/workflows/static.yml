<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блокировка | Реестр</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Black', 'Impact', sans-serif;
            background: linear-gradient(145deg, #0b0f1a 0%, #1a1f30 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            color: white;
        }

        /* Анимированные волны */
        .wave-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.25;
        }

        .wave-bg svg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: auto;
            min-height: 300px;
        }

        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-size: clamp(3rem, 15vw, 8rem);
            line-height: 1.1;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-shadow: 0 0 20px rgba(255, 70, 70, 0.5);
            background: linear-gradient(135deg, #ff8a8a, #ff4d4d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            filter: drop-shadow(0 10px 8px rgba(0,0,0,0.5));
        }

        .blocked-domain {
            font-size: clamp(1.5rem, 5vw, 3rem);
            font-family: 'Courier New', monospace;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 2px solid #ff4d4d;
            border-radius: 100px;
            padding: 1rem 2rem;
            display: inline-block;
            margin-top: 2rem;
            letter-spacing: 0.15em;
            color: #ffb3b3;
            box-shadow: 0 0 30px rgba(255, 77, 77, 0.3);
        }

        .badge {
            font-family: 'Arial', sans-serif;
            font-size: 1rem;
            text-transform: uppercase;
            background: #ff4d4d;
            color: black;
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            display: inline-block;
            margin-bottom: 2rem;
            font-weight: bold;
            letter-spacing: 0.2em;
            border: 1px solid rgba(255,255,255,0.3);
        }

        /* Делаем волны красивее */
        .wave1 { fill: rgba(255, 77, 77, 0.3); animation: waveAnim 12s infinite linear; }
        .wave2 { fill: rgba(200, 50, 50, 0.3); animation: waveAnim 15s infinite linear reverse; }
        .wave3 { fill: rgba(150, 30, 30, 0.2); animation: waveAnim 10s infinite linear; }

        @keyframes waveAnim {
            0% { transform: translateX(0) translateY(0); }
            50% { transform: translateX(-5%) translateY(2%); }
            100% { transform: translateX(0) translateY(0); }
        }

        /* Дополнительный слой для читаемости */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, transparent 0%, rgba(0,0,0,0.3) 100%);
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>
    <!-- Фоновые волны SVG -->
    <div class="wave-bg">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320" preserveAspectRatio="none">
            <path class="wave1" d="M0,160L48,176C96,192,192,224,288,218.7C384,213,480,171,576,138.7C672,107,768,85,864,101.3C960,117,1056,171,1152,186.7C1248,203,1344,181,1392,170.7L1440,160L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
            <path class="wave2" d="M0,256L48,234.7C96,213,192,171,288,165.3C384,160,480,192,576,208C672,224,768,224,864,208C960,192,1056,160,1152,154.7C1248,149,1344,171,1392,181.3L1440,192L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
            <path class="wave3" d="M0,288L48,288C96,288,192,288,288,272C384,256,480,224,576,218.7C672,213,768,235,864,240C960,245,1056,235,1152,213.3C1248,192,1344,160,1392,144L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
        </svg>
    </div>
    
    <!-- Затемняющий слой -->
    <div class="overlay"></div>

    <!-- Контент по центру -->
    <div class="content">
        <div class="badge">🚫 РЕЕСТР ЗАБЛОКИРОВАННЫХ САЙТОВ</div>
        <h1>ДОСТУП ОГРАНИЧЕН</h1>
        <div class="blocked-domain">
            этот домен был заблокирован<br>
            реестром dbdwin bwcr<br>
            (blocked web content register)
        </div>
    </div>
</body>
</html>
